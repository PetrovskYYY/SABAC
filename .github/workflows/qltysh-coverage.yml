name: Qlty Coverage

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    env:
      # CC_TEST_REPORTER_ID should be stored in GitHub Secrets
      CC_TEST_REPORTER_ID: ${{ secrets.CC_TEST_REPORTER_ID }}
    strategy:
      matrix:
        platform: [ ubuntu-22.04 ]
        python-version: [3.7, 3.11, 3.13]
    name: Coverage/python ${{ matrix.python-version }}/${{ matrix.platform }}
    runs-on: ${{ matrix.platform }}
    steps:
    - uses: actions/checkout@main

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@main
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt

    - name: Generate coverage information
      run: |
        PYTHONPATH=. coverage run -m pytest ./tests
        coverage xml

    - name: Upload coverage to Qlty
      uses: qltysh/qlty-action/coverage@v2
      with:
        oidc: true  # Enables OIDC authentication
        files: coverage.xml
